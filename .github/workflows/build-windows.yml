name: Build Windows installer

# Runs the tests on every push and pull request.
# On a version tag (v0.1.0, v0.2.0 ...) it also builds the Windows installer
# and publishes it on the Releases page, which is where families download it.
#
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
      - name: Test
        run: pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -notmatch '^v\d') { $v = "v0.0.0-dev" }
          "version=$($v.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Build the app with PyInstaller
        run: pyinstaller installer/recruiting_desk.spec --noconfirm --distpath dist --workpath build

      - name: Smoke-test the build
        shell: pwsh
        run: |
          $exe = "dist\RecruitingDesk\recruiting-desk-mcp.exe"
          if (-not (Test-Path $exe)) { throw "MCP executable missing" }
          if (-not (Test-Path "dist\RecruitingDesk\Recruiting Desk.exe")) { throw "App executable missing" }
          if (-not (Test-Path "dist\RecruitingDesk\_internal\recruiting_desk\static\index.html")) { throw "UI files not bundled" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\recruiting_desk.iss

      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem dist\RecruitingDesk-Setup-*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RecruitingDesk-Setup
          path: |
            dist/RecruitingDesk-Setup-*.exe
            dist/RecruitingDesk-Setup-*.exe.sha256

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RecruitingDesk-Setup-*.exe
            dist/RecruitingDesk-Setup-*.exe.sha256
          body_path: docs/RELEASE_NOTES.md
