[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiting-desk"
version = "0.1.0"
description = "Help a high school softball or baseball player write to college coaches, using their own data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "mcp>=1.2",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
recruiting-desk = "recruiting_desk.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recruiting_desk = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
