<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recruiting Desk</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16212B; --ink-2:#44535F; --ink-3:#7C8A94;
    --paper:#F6F7F5; --card:#FFFFFF; --line:#DEE2DB;
    --optic:#C9DC3F; --optic-deep:#8A9B12;
    --hold:#A83A2A; --live:#2E6B4F; --wait:#9A6B12;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ECF0EA; --ink-2:#AEBAB4; --ink-3:#7E8B86;
      --paper:#10161A; --card:#182026; --line:#2A353C;
      --optic:#C9DC3F; --optic-deep:#D9EC55;
      --hold:#E0705C; --live:#63B58C; --wait:#D6A63F;
    }
  }
  :root[data-theme="dark"]{
    --ink:#ECF0EA; --ink-2:#AEBAB4; --ink-3:#7E8B86;
    --paper:#10161A; --card:#182026; --line:#2A353C;
    --hold:#E0705C; --live:#63B58C; --wait:#D6A63F;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px 110px}
  header.top{padding:18px 0 4px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{font-size:21px;font-weight:700;letter-spacing:-0.02em;margin:0}
  .who{font-size:13px;color:var(--ink-3)}
  nav.tabs{display:flex;gap:2px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 10px;scrollbar-width:none;
    border-bottom:1px solid var(--line)}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;
    color:var(--ink-3);font:inherit;font-size:14px;font-weight:600;padding:6px 10px;margin-bottom:-11px;cursor:pointer}
  nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--optic-deep)}
  nav.tabs button:focus-visible{outline:2px solid var(--optic-deep);outline-offset:2px}
  section.view{display:none;padding-top:14px}
  section.view.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;margin:12px 0}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:600}
  .card .lede{font-size:13.5px;color:var(--ink-3);margin-bottom:10px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .grow{flex:1 1 180px;min-width:0}
  label{display:block;font-size:12px;color:var(--ink-3);margin:8px 0 3px;font-weight:500}
  input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--paper);
    border:1px solid var(--line);border-radius:8px;padding:9px 10px}
  textarea{resize:vertical;min-height:80px;line-height:1.55}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--optic-deep);outline-offset:1px;border-color:transparent}
  button.btn{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:10px 15px;cursor:pointer;
    background:var(--optic);color:#16212B;border:1px solid var(--optic-deep)}
  button.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  button.btn.quiet{background:transparent;color:var(--ink-3);border:0;padding:6px 8px;font-size:13px}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  button.btn:focus-visible{outline:2px solid var(--optic-deep);outline-offset:2px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--ink-2)}
  .pill.hold{color:var(--hold);border-color:var(--hold)}
  .pill.live{color:var(--live);border-color:var(--live)}
  .pill.wait{color:var(--wait);border-color:var(--wait)}
  .muted{color:var(--ink-3);font-size:13px}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:24px 16px;text-align:center;color:var(--ink-3);font-size:14px}
  .banner{border-left:3px solid var(--wait);background:color-mix(in srgb,var(--wait) 9%,transparent);
    padding:11px 13px;border-radius:0 8px 8px 0;font-size:13.5px;margin:12px 0}
  .banner.stop{border-left-color:var(--hold);background:color-mix(in srgb,var(--hold) 8%,transparent)}
  .checklist{list-style:none;padding:0;margin:0}
  .checklist li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .checklist li:last-child{border-bottom:0}
  .tick{flex:0 0 20px;height:20px;border-radius:50%;border:1.5px solid var(--line);margin-top:1px;
    display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--card)}
  .tick.done{background:var(--optic);border-color:var(--optic-deep);color:#16212B}
  .kinds{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:640px){.kinds{grid-template-columns:1fr 1fr}}
  .kind{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;font:inherit;color:var(--ink)}
  .kind[aria-pressed="true"]{border-color:var(--optic-deep);box-shadow:inset 0 0 0 1px var(--optic-deep)}
  .kind b{display:block;font-size:15px;margin-bottom:3px}
  .kind span{font-size:13px;color:var(--ink-3)}
  .kind:disabled{opacity:.5;cursor:not-allowed}
  .listrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0}
  .listrow .name{font-weight:600;font-size:15px}
  .listrow .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .stat-line{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0;font-size:14px}
  .stat-line b{font-weight:600;min-width:72px}
  .stat-line .src{color:var(--ink-3);font-size:12px;flex:1}
  table{width:100%;border-collapse:collapse;font-size:14px}
  .scroll-x{overflow-x:auto}
  th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  .facts li{font-size:13px;color:var(--ink-2);margin-bottom:3px}
  .draftbox{min-height:250px;font-size:15px;line-height:1.6}
  .cred{max-width:380px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Recruiting Desk</h1>
    <div class="who"><span id="who"></span> <a href="/static/setup.html" style="margin-left:10px">Settings</a></div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="home" aria-selected="true">Start here</button>
    <button role="tab" data-view="player" aria-selected="false">Player</button>
    <button role="tab" data-view="links" aria-selected="false">Profiles</button>
    <button role="tab" data-view="coaches" aria-selected="false">Coaches</button>
    <button role="tab" data-view="write" aria-selected="false">Write</button>
    <button role="tab" data-view="sent" aria-selected="false">Sent</button>
  </nav>
  <section class="view on" id="view-home"></section>
  <section class="view" id="view-player"></section>
  <section class="view" id="view-links"></section>
  <section class="view" id="view-coaches"></section>
  <section class="view" id="view-write"></section>
  <section class="view" id="view-sent"></section>
</div>

<script src="/static/bridge.js"></script>
<script>
(function(){
  "use strict";

  var S = {athletes:{}, targets:{}, rules:null, aid:null, tid:null, kind:"intro",
           db:null, sample:null, downloads:null, draft:{subject:"",body:"",facts:[]}, busy:false};
  var LS = "recruiting-desk-v2";

  function uid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID().slice(0,12) : "x"+Math.random().toString(36).slice(2,10); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function el(id){ return document.getElementById(id); }
  function clone(o){ return JSON.parse(JSON.stringify(o||{})); }

  function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify({athletes:S.athletes,targets:S.targets,rules:S.rules})); }catch(e){} }
  function loadLocal(){ try{ var d=JSON.parse(localStorage.getItem(LS)||"null"); if(d){S.athletes=d.athletes||{};S.targets=d.targets||{};S.rules=d.rules||null;} }catch(e){} }

  function putAthlete(r){ S.athletes[r.id]=r; if(S.db) S.db.doc("athletes/"+r.id).set(r).catch(fail); else saveLocal(); }
  function putTarget(r){ S.targets[r.id]=r; if(S.db) S.db.doc("targets/"+r.id).set(r).catch(fail); else saveLocal(); }
  function dropTarget(id){ delete S.targets[id]; if(S.db) S.db.doc("targets/"+id).delete().catch(fail); else saveLocal(); }
  var failed=false;
  function fail(){ if(failed) return; failed=true; var w=el("who"); if(w) w.textContent="Read-only — changes aren't saving"; }

  /* ---------- contact windows ---------- */
  function defaultRules(){
    return {verifiedOn:"", verifiedBy:"", divisions:[
      {key:"I",label:"NCAA Division I",monthDay:"09-01",yearsBeforeGrad:2,note:"Coaches may begin recruiting communication Sept 1 of junior year."},
      {key:"II",label:"NCAA Division II",monthDay:"06-15",yearsBeforeGrad:2,note:"Coaches may begin recruiting communication June 15 after sophomore year."},
      {key:"III",label:"NCAA Division III",monthDay:"",yearsBeforeGrad:0,note:"No date restriction."},
      {key:"NAIA",label:"NAIA",monthDay:"",yearsBeforeGrad:0,note:"No date restriction."},
      {key:"JUCO",label:"Junior college",monthDay:"",yearsBeforeGrad:0,note:"No date restriction."}]};
  }
  function ruleFor(d){ var r=S.rules||defaultRules(); for(var i=0;i<r.divisions.length;i++) if(r.divisions[i].key===d) return r.divisions[i]; return null; }
  function gate(t){
    var a=S.athletes[t.athleteId], rule=ruleFor(t.division);
    if(!rule||!rule.monthDay) return {open:true,rule:rule};
    var grad=a&&parseInt(a.gradYear,10);
    if(!grad) return {open:false,unknown:true,rule:rule};
    var d=new Date((grad-(rule.yearsBeforeGrad||0))+"-"+rule.monthDay+"T00:00:00");
    return {open:new Date()>=d, date:d, rule:rule};
  }
  function fmt(d){ return d? d.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"}) : ""; }

  /* ---------- derived ---------- */
  function athleteList(){ return Object.keys(S.athletes).map(function(k){return S.athletes[k];}).sort(function(a,b){return (a.name||"").localeCompare(b.name||"");}); }
  function A(){ if(S.aid&&S.athletes[S.aid]) return S.athletes[S.aid]; var l=athleteList(); S.aid=l.length?l[0].id:null; return l[0]||null; }
  function targetsFor(id){ return Object.keys(S.targets).map(function(k){return S.targets[k];}).filter(function(t){return t.athleteId===id;})
      .sort(function(a,b){ return (a.school||"").localeCompare(b.school||""); }); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }

  function setup(a){
    var t = targetsFor(a?a.id:"");
    return [
      {k:"links",   done:!!(a&&(a.links||[]).length), label:"Add their profile links", hint:"Start with GameChanger \u2014 name, class year, positions and every season\u2019s stats come straight off a published profile. FieldLevel adds height, weight and hometown."},
      {k:"basics",  done:!!(a&&a.name&&a.gradYear&&a.positions), label:"Fill in the player’s details", hint:"Name, sport, class year, positions."},
      {k:"stats",   done:!!(a&&(a.stats||[]).length), label:"Add the stat line", hint:"Nothing can go in an email that isn't here first."},
      {k:"voice",   done:!!(a&&(a.voice||"").trim().length>120), label:"Paste something the player wrote", hint:"A few paragraphs in their own words. This is what stops emails sounding like a parent."},
      {k:"coaches", done:t.length>0, label:"Add coaches to write to", hint:t.length?(t.length+" on the list"):"Schools and the coach at each one."}
    ];
  }

  /* ---------- views ---------- */
  var VIEW="home";

  /* Background data refreshes redraw the page. Anything half-typed into an
     unsaved box -- a search, a link, a new coach's details -- must survive
     that, along with which box has focus. User actions call render() directly
     and are allowed to clear fields; only refresh-driven redraws preserve. */
  function softRender(){
    var host=el("view-"+VIEW), keep={}, active=document.activeElement, focusId=active&&active.id, caret=null;
    if(host) Array.prototype.forEach.call(host.querySelectorAll("input[id],textarea[id]"),function(i){
      if(i.type!=="file"&&i.type!=="checkbox"&&i.value) keep[i.id]=i.value;
    });
    if(focusId&&typeof active.selectionStart==="number"){ try{ caret=active.selectionStart; }catch(e){} }
    render();
    Object.keys(keep).forEach(function(id){ var n=el(id); if(n&&!n.value) n.value=keep[id]; });
    if(focusId&&el(focusId)){ var f=el(focusId); f.focus(); if(caret!==null){ try{ f.setSelectionRange(caret,caret); }catch(e){} } }
  }

  function render(){
    var a=A();
    el("who").textContent = a ? (a.name||"Unnamed player") + " · " + (a.sport||"softball") + (athleteList().length>1?" · "+athleteList().length+" players":"") : "";
    ({home:renderHome, player:renderPlayer, links:renderLinks, coaches:renderCoaches, write:renderWrite, sent:renderSent})[VIEW]();
  }

  function picker(){
    var l=athleteList(); if(l.length<2) return "";
    return '<div class="row" style="margin-bottom:6px"><div class="grow" style="max-width:250px"><label>Athlete</label><select id="apick">'+
      l.map(function(a){return '<option value="'+esc(a.id)+'"'+(a.id===S.aid?' selected':'')+'>'+esc(a.name||"Unnamed")+'</option>';}).join("")+
      '</select></div></div>';
  }
  function wirePicker(){ var p=el("apick"); if(p) p.onchange=function(){ S.aid=p.value; S.tid=null; render(); }; }

  /* --- Start here --- */
  function renderHome(){
    var a=A(), host=el("view-home");
    if(!a){
      host.innerHTML='<div class="card"><h3>Set up a player</h3>'+
        '<div class="lede">One player per campaign. You can add another later.</div>'+'<label>Sport</label><select id="newsport" style="max-width:220px"><option value="softball">Softball</option><option value="baseball">Baseball</option></select>'+
        '<button class="btn" id="new">Start</button></div>';
      el("new").onclick=function(){ newAthlete(el("newsport")?el("newsport").value:"softball"); };
      return;
    }
    var steps=setup(a), left=steps.filter(function(s){return !s.done;});
    host.innerHTML = picker()+ pasteCard(a) +

      '<div class="card"><h3>'+(left.length? "Before the first email goes out" : "Ready to write")+'</h3>'+
        '<div class="lede">'+(left.length? (left.length+" thing"+(left.length>1?"s":"")+" left.") : "The record is complete. Pick a coach and an email on the Write tab.")+'</div>'+
        '<ul class="checklist">'+steps.map(function(s){
          return '<li><span class="tick'+(s.done?' done':'')+'">'+(s.done?'&#10003;':'')+'</span>'+
            '<span><b style="font-weight:600">'+esc(s.label)+'</b><div class="muted">'+esc(s.hint)+'</div></span></li>';
        }).join("")+'</ul></div>'+

      '<div class="card"><h3>What this does</h3><div class="lede">Four kinds of email, all built from the player’s own numbers.</div>'+
        '<ul class="checklist">'+
        '<li><span><b style="font-weight:600">First email</b><div class="muted">Introduces the player to a coach who has never heard of them.</div></span></li>'+
        '<li><span><b style="font-weight:600">Coming up</b><div class="muted">Tells a coach where to find them at the next tournament — field, time, jersey.</div></span></li>'+
        '<li><span><b style="font-weight:600">Follow up</b><div class="muted">Nudges a coach who hasn\'t answered, with whatever has changed since.</div></span></li>'+
        '<li><span><b style="font-weight:600">Thank you</b><div class="muted">For a coach who actually came and watched. The one most families skip and the one coaches remember.</div></span></li>'+
        '</ul></div>'+
      '<button class="btn quiet" id="new2">Add another athlete</button>';

    wirePicker();
    wirePaste(a, host);
    el("new2").onclick=function(){ newAthlete((A()||{}).sport||"softball"); };
  }
  function newAthlete(sport){
    var r={id:uid(),name:"",sport:sport||"softball",pronouns:"",gradYear:"",school:"",club:"",jersey:"",positions:"",gpa:"",tests:"",major:"",
           email:"",phone:"",ncaaId:"",refName:"",refEmail:"",refPhone:"",voice:"",stats:[],events:[],links:[],socials:[]};
    putAthlete(r); S.aid=r.id; switchView("player");
  }


  /* ---------- pasted profile links ---------- */
  var PLATFORMS=[
    {id:"gamechanger",label:"GameChanger",kind:"profile",re:/(?:web\.)?gc\.com\/athlete\/([A-Za-z0-9_.\-]+)/i,
     note:"GameChanger pages draw in the browser, so the link carries no stats. Connect the account in Settings for the real numbers."},
    {id:"sportsrecruits",label:"SportsRecruits",kind:"profile",re:/sportsrecruits\.com\/athlete\/([A-Za-z0-9_.\-]+)/i},
    {id:"fieldlevel",label:"FieldLevel",kind:"profile",re:/fieldlevel\.com\/(?:profile\/)?([A-Za-z0-9_.\-]+)/i},
    {id:"hudl",label:"Hudl",kind:"profile",re:/hudl\.com\/profile\/(\d+)/i},
    {id:"youtube",label:"YouTube",kind:"profile",re:/youtube\.com\/(@[A-Za-z0-9_.\-]+|channel\/[A-Za-z0-9_\-]+)/i},
    {id:"instagram",label:"Instagram",kind:"social",re:/instagram\.com\/([A-Za-z0-9_.]+)/i,
     note:"Instagram only shows profiles to a signed-in browser, so nothing can be read from the link."},
    {id:"x",label:"X",kind:"social",re:/(?:twitter|x)\.com\/([A-Za-z0-9_]+)/i,
     note:"X only shows profiles to a signed-in browser."},
    {id:"facebook",label:"Facebook",kind:"social",re:/facebook\.com\/([A-Za-z0-9_.\-]+)/i,
     note:"Facebook only shows profiles to a signed-in browser."},
    {id:"tiktok",label:"TikTok",kind:"social",re:/tiktok\.com\/(@[A-Za-z0-9_.]+)/i,
     note:"TikTok only shows profiles to a signed-in browser."}
  ];
  function identifyLink(url){
    var u=(url||"").trim(); if(!u) return null;
    for(var i=0;i<PLATFORMS.length;i++){
      var m=u.match(PLATFORMS[i].re);
      if(m) return {platform:PLATFORMS[i].id,label:PLATFORMS[i].label,kind:PLATFORMS[i].kind,
                    handle:m[1],note:PLATFORMS[i].note||"",url:/^https?:/i.test(u)?u:"https://"+u};
    }
    return {platform:"other",label:"Profile",kind:"profile",handle:"",note:"",url:/^https?:/i.test(u)?u:"https://"+u};
  }
  var FIELD_LABELS={name:"Name",sport:"Sport",gradYear:"Class of",positions:"Positions",school:"High school",
                  gpa:"GPA",height:"Height",weight:"Weight",hometown:"Hometown",bio:"Bio"};
  var linkState={busy:false,msg:"",result:null};

  function addLink(a,who){
    if(who.kind==="social"){
      a.socials=a.socials||[];
      if(!a.socials.some(function(x){return (x.handle||"")===who.handle&&x.platform===who.label;}))
        a.socials.push({platform:who.label,handle:who.handle||who.url,include:false});
    } else {
      a.links=a.links||[];
      if(!a.links.some(function(x){return x.url===who.url;}))
        a.links.push({label:who.label,url:who.url,include:true});
      if(who.platform==="gamechanger") a.gcProfileUrl=who.url;
    }
    putAthlete(a);
  }

  function inspectLink(a, who){
    linkState={busy:true,msg:"",result:null}; render();
    fetch("/api/profile/inspect?url="+encodeURIComponent(who.url))
      .then(function(res){ return res.ok? res.json() : Promise.reject(); })
      .then(function(d){
        linkState={busy:false,result:d,picked:null,
          msg:(d.label||who.label)+" saved. "+(d.message||who.note||"")+(d.stats_message?" "+d.stats_message:"")};
        render();
      })
      .catch(function(){
        linkState={busy:false,result:null,
          msg:who.label+" saved."+(who.note?" "+who.note:
            " Reading the page for details only works in the installed app.")};
        render();
      });
  }

  function seasonYear(name){ var m=String(name||"").match(/(\d{4})/); return m?+m[1]:0; }
  function statBits(block, keep){
    return (block||[]).filter(function(b){ return keep.indexOf(b.label)>=0; })
      .map(function(b){ return b.label+" "+b.value; }).join(" \u00b7 ");
  }
  var BAT_KEEP=["PA","AVG","OBP","SLG","OPS","RBI"], PIT_KEEP=["IP","ERA","K","BB","WHIP"];
  var PITCH_MIN_IP=5;
  function inningsOf(s){
    var ip=(s.pitching||[]).filter(function(b){ return b.label==="IP"; })[0];
    if(!ip) return 0;
    var parts=String(ip.value).split("."); return (+parts[0]||0)+((+parts[1]||0)/3);
  }

  function seasonPicker(r){
    if(!r||!r.seasons||!r.seasons.length) return "";
    if(!linkState.picked){
      // Defaults are only a starting point, and every one is visible:
      // batting for the newest year's seasons; pitching only where there is
      // a real sample, so a 1-inning outing never reaches a coach unchosen.
      var newest=seasonYear(r.seasons[0].season);
      linkState.picked=r.seasons.map(function(s){
        var recent=seasonYear(s.season)===newest;
        return {bat: recent && (s.batting||[]).length>0, pit: recent && inningsOf(s)>=PITCH_MIN_IP};
      });
      linkState.pickedCareer=false;
    }
    var rows=r.seasons.map(function(s,i){
      var bat=statBits(s.batting,["PA","AVG","OBP","OPS"]), pit=statBits(s.pitching,["IP","ERA","K"]);
      var pk=linkState.picked[i], small=pit && inningsOf(s)<PITCH_MIN_IP;
      return '<div class="stat-line" style="display:block;padding:9px 0">'+
        '<div><b style="font-weight:600">'+esc(s.season)+'</b> <span class="muted">'+esc(s.team)+'</span></div>'+

          '<input type="checkbox" data-season="'+i+'" data-part="bat"'+(pk.bat?' checked':'')+' style="width:auto">Batting: '+esc(bat)+'</label>':'')+
        (pit?'<label class="muted" style="display:flex;gap:8px;align-items:center;margin:4px 0 0">'+
          '<input type="checkbox" data-season="'+i+'" data-part="pit"'+(pk.pit?' checked':'')+' style="width:auto">Pitching: '+esc(pit)+
          (small?' <span class="pill wait" style="margin-left:4px">small sample</span>':'')+'</label>':'')+
        '</div>';
    }).join("");
    var c=r.career, career = c ? '<label class="stat-line" style="gap:10px;align-items:flex-start">'+
        '<input type="checkbox" data-season="career"'+(linkState.pickedCareer?' checked':'')+' style="width:auto;margin-top:4px">'+
        '<span style="flex:1"><b style="font-weight:600">Career total</b> <span class="muted">every team and age group</span>'+
        '<div class="muted">Usually not what a college coach wants \u2014 it mixes in younger-age ball. Recent seasons tell them more.</div></span></label>' : "";
    return '<div style="margin-top:16px"><h3 style="margin:0 0 4px">Stats from GameChanger</h3>'+
      '<div class="lede">'+r.seasons.length+' seasons found. Tick what belongs in emails \u2014 batting and pitching separately. Each number will name the season and team it came from.</div>'+
      '<div style="max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:0 10px">'+rows+career+'</div>'+
      '<button class="btn" id="addseasons" style="margin-top:10px">Add ticked seasons to the stat line</button></div>';
  }

  function addSeasons(a, r){
    var chosen=[];
    r.seasons.forEach(function(s,i){
      var pk=linkState.picked[i];
      if(pk.bat||pk.pit) chosen.push({source:s.source, batting:pk.bat?s.batting:[], pitching:pk.pit?s.pitching:[]});
    });
    if(linkState.pickedCareer && r.career) chosen.push({source:r.career.source,batting:r.career.batting,pitching:r.career.pitching});
    a.stats=a.stats||[];
    var added=0;
    chosen.forEach(function(s){
      var items=[];
      (s.batting||[]).forEach(function(b){ if(BAT_KEEP.indexOf(b.label)>=0) items.push({label:b.label,value:b.value}); });
      (s.pitching||[]).forEach(function(b){
        if(PIT_KEEP.indexOf(b.label)>=0) items.push({label:(b.label==="K"||b.label==="BB")?"Pitching "+b.label:b.label, value:b.value});
      });
      items.forEach(function(it){
        a.stats=a.stats.filter(function(x){ return !(x.label===it.label && x.source===s.source); });
        a.stats.push({label:it.label,value:it.value,source:s.source}); added++;
      });
    });
    putAthlete(a);
    return {numbers:added, seasons:chosen.length};
  }

  function wirePaste(a,host){

        if(x && x.value) a[x.field]=x.value;
      });

      else linkState={busy:false,msg:"Added to the record. Check each one.",result:null};

    };

        msg: n.numbers ? ("Added "+n.numbers+" numbers from "+n.seasons+" season"+(n.seasons===1?"":"s")+" to the stat line. Each one names its season and team \u2014 see the Player tab.")
                       : "No seasons were ticked, so nothing was added."};
      render();
    };
  }

  /* Records saved before the reference coach was split into three fields kept it
     as one line, e.g. "Pat Coach, (555) 111-2222, pat@club.org". Pull the email
     and phone out by pattern; what remains is the name. Runs once per record. */
  function migrateReference(a){
    if(!a || !a.coachRef || a.refName || a.refEmail || a.refPhone) return false;
    var t=String(a.coachRef);
    var em=t.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);
    var ph=t.match(/\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]\d{4}/);
    if(em) t=t.replace(em[0],"");
    if(ph) t=t.replace(ph[0],"");
    a.refEmail=em?em[0]:""; a.refPhone=ph?ph[0]:"";
    a.refName=t.replace(/[,;|]+/g," ").replace(/\s+/g," ").trim();
    delete a.coachRef;
    return true;
  }

      var have=existingEmails(a);

      var rows=p.rows.map(function(r,i){
        var dup=r.coachEmail && have[r.coachEmail.toLowerCase()];
        var ok=r.usable && !dup; if(ok) ready++;
        var probs=r.problems.slice(); if(dup) probs.push("already on the list");
        return '<tr><td><input type="checkbox" data-ir="'+i+'"'+(CS.iticks[i]&&ok?' checked':'')+(ok?'':' disabled')+' style="width:auto"></td>'+
          '<td>'+esc(r.school)+'</td><td>'+esc(r.division)+'</td><td>'+esc(r.coachName)+'</td><td>'+esc(r.coachEmail)+'</td>'+
          '<td style="color:var(--wait)">'+esc(probs.join("; "))+'</td></tr>';
      }).join("");
      h+='<div style="margin-top:12px"><b>'+ready+' ready to add</b><span class="muted"> of '+p.total+' rows \u00b7 headings found on line '+p.header_line+': '+esc(p.columns.join(", "))+'</span></div>'+
        '<div class="scroll-x" style="margin-top:6px;max-height:380px;overflow:auto"><table><thead><tr><th></th><th>School</th><th>Div</th><th>Coach</th><th>Email</th><th>Needs attention</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
        '<button class="btn" id="imp-add" style="margin-top:10px">Add ticked coaches</button>';
    }
    return h;
  }

  function manualBody(){
    return '<div class="row">'+
        '<div class="grow"><label>School</label><input id="c-school"></div>'+
        '<div class="grow" style="max-width:120px"><label>Division</label><select id="c-div">'+
          ["I","II","III","NAIA","JUCO"].map(function(d){return '<option>'+d+'</option>';}).join("")+'</select></div>'+
        '<div class="grow"><label>Where</label><input id="c-loc"></div></div>'+
      '<div class="row"><div class="grow"><label>Coach</label><input id="c-name"></div>'+
        '<div class="grow"><label>Email</label><input id="c-email" type="email"></div></div>'+
      '<label>Why this school, in the player\u2019s words</label><textarea id="c-fit" rows="2" placeholder="They graduate two pitchers next year and it has the major they want."></textarea>'+
      '<button class="btn" id="c-add" style="margin-top:8px">Add coach</button>';
  }

  function renderCoaches(){
    var a=A(), host=el("view-coaches");
    if(!a){ host.innerHTML='<div class="empty">Add an athlete first.</div>'; return; }
    var list=targetsFor(a.id);
    var rows=list.map(function(t){
      var g=gate(t);
      var pill=g.open?'<span class="pill live">Can write now</span>'
        :(g.unknown?'<span class="pill wait">Needs a class year</span>'
          :'<span class="pill hold">Coaches can\'t reply until '+esc(fmt(g.date))+'</span>');
      var hist=(t.log||[]);
      var last=hist.length?('<span class="pill">'+esc(hist[hist.length-1].kind)+' '+esc(hist[hist.length-1].date)+'</span>'):"";
      var watched=t.watched?'<span class="pill live">Came to watch</span>':"";
      return '<div class="listrow"><div class="grow"><div class="name">'+esc(t.school)+'</div>'+
        '<div class="meta">'+esc(t.division)+' \u00b7 '+esc(t.location||"")+' \u00b7 '+esc(t.coachName||"no coach named")+(t.title?' ('+esc(t.title)+')':'')+'</div>'+
        '<div class="meta">'+esc(t.coachEmail||"no email")+'</div>'+
        (t.note?'<div class="meta" style="color:var(--wait)">'+esc(t.note)+'</div>':'')+
        '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">'+pill+last+watched+'</div></div>'+
        '<div style="display:flex;flex-direction:column;gap:6px">'+
        '<button class="btn" data-w="'+esc(t.id)+'">Write</button>'+
        '<button class="btn quiet" data-x="'+esc(t.id)+'">Remove</button></div></div>';
    }).join("") || '<div class="empty">No coaches yet. Find a school or import a list above.</div>';

    var modes=[["find","Find a school"],["import","Import a list"],["manual","Type one in"]];
    host.innerHTML = picker()+
      '<div class="card"><h3>Add coaches</h3>'+
      '<div class="row" style="gap:6px;margin:6px 0 12px">'+modes.map(function(m){
        return '<button class="btn'+(CS.mode===m[0]?'':' ghost')+'" data-mode="'+m[0]+'">'+m[1]+'</button>'; }).join("")+'</div>'+
      (CS.mode==="find"?findBody(a):CS.mode==="import"?importBody(a):manualBody())+'</div>'+
      '<h3 style="margin:18px 0 4px;font-size:15px">'+(list.length?list.length+' coach'+(list.length===1?'':'es')+' on the list':'The list')+'</h3>'+
      rows;

    wirePicker();
    Array.prototype.forEach.call(host.querySelectorAll("[data-mode]"),function(b){
      b.onclick=function(){ CS.mode=b.getAttribute("data-mode"); CS.msg=""; render(); };
    });

    // ---- find a school
    if(CS.mode==="find"){
      var q=el("sch-q"), go=el("sch-go");
      q.onkeydown=function(e){ if(e.key==="Enter") go.click(); };
      go.onclick=function(){
        var v=q.value.trim(); if(!v) return;
        CS.q=v; CS.msg=""; CS.coaches=null; CS.schools=null;
        if(looksLikeSite(v)){ showCoaches(a,{name:v.replace(/^https?:\/\//,"").replace(/\/.*$/,""),division:"",state:"",athletics_url:v}); return; }
        CS.busy=true; render();
        fetch("/api/schools/search?q="+encodeURIComponent(v)).then(function(r){ return r.json(); })
          .then(function(d){ CS.busy=false; CS.schools=d.schools||[]; if(!d.ok) CS.msg=(d.error&&d.error.message)||"Search failed."; render(); })
          .catch(function(){ CS.busy=false; CS.msg="School search only works in the installed app."; render(); });
      };
      Array.prototype.forEach.call(host.querySelectorAll("[data-sch]"),function(b){
        b.onclick=function(){ showCoaches(a, CS.schools[+b.getAttribute("data-sch")]); };
      });
      if(el("sch-back")) el("sch-back").onclick=function(){ CS.coaches=null; CS.msg=""; render(); };
      var recount=function(){ var n=el("ck-count"); if(n) n.textContent=CS.ticks.filter(Boolean).length+" selected"; };
      Array.prototype.forEach.call(host.querySelectorAll("[data-ck]"),function(c){
        c.onchange=function(){ CS.ticks[+c.getAttribute("data-ck")]=c.checked; recount(); };
      });
      var setAll=function(pick){
        var have=existingEmails(a);
        CS.ticks=CS.coaches.map(function(c){ return pick(c) && !(c.email && have[c.email.toLowerCase()]); });
        render();
      };
      if(el("ck-all")) el("ck-all").onclick=function(){ setAll(function(){ return true; }); };
      if(el("ck-none")) el("ck-none").onclick=function(){ setAll(function(){ return false; }); };
      if(el("ck-coaches")) el("ck-coaches").onclick=function(){ setAll(function(c){ return c.is_coach && !!c.email; }); };
      if(el("ck-add")) el("ck-add").onclick=function(){
        var n=0, have=existingEmails(a);
        CS.coaches.forEach(function(c,i){
          if(!CS.ticks[i]) return;
          if(c.email && have[c.email.toLowerCase()]) return;
          putTarget({id:uid(),athleteId:a.id,school:CS.school.name,division:CS.school.division||"",
            location:[CS.school.city,CS.school.state].filter(Boolean).join(", "),
            coachName:c.name,title:c.title||"",coachEmail:c.email||"",fit:"",tier:"3",log:[],watched:false,
            note:c.email?"From the school\u2019s "+(c.from_directory?"staff directory":"coaches page")+" \u2014 confirm on "+c.source_url+" before writing."
                        :"No email published by the school. Find it before writing."});
          n++;
        });
        CS.coaches=null; CS.schools=null; CS.q="";
        CS.msg=n?("Added "+n+" coach"+(n===1?"":"es")+" from "+CS.school.name+"."):"Nothing ticked, so nothing was added.";
        render();
      };
    }

    // ---- import a list
    if(CS.mode==="import"){
      el("imp-file").onchange=function(){
        var f=this.files&&this.files[0]; if(!f) return;
        var fr=new FileReader();
        fr.onload=function(){
          var b64=String(fr.result).split(",")[1]||"";
          CS.msg="Reading "+f.name+"\u2026"; CS.preview=null; render();
          fetch("/api/coaches/import",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({filename:f.name,data:b64})})
            .then(function(r){ return r.json(); })
            .then(function(d){
              if(!d.ok){ CS.msg=d.error||"That file couldn\u2019t be read."; CS.preview=null; render(); return; }
              CS.preview=d; CS.iticks=d.rows.map(function(r){ return r.usable; }); CS.msg=""; render();
            })
            .catch(function(){ CS.msg="Importing a list only works in the installed app."; render(); });
        };
        fr.readAsDataURL(f);
      };
      Array.prototype.forEach.call(host.querySelectorAll("[data-ir]"),function(c){
        c.onchange=function(){ CS.iticks[+c.getAttribute("data-ir")]=c.checked; };
      });
      if(el("imp-add")) el("imp-add").onclick=function(){
        var n=0, have=existingEmails(a);
        CS.preview.rows.forEach(function(r,i){
          if(!CS.iticks[i]||!r.usable) return;
          var e=r.coachEmail.toLowerCase(); if(have[e]) return; have[e]=1;
          putTarget({id:uid(),athleteId:a.id,school:r.school,division:r.division,location:r.location,
            coachName:r.coachName,title:r.title,coachEmail:r.coachEmail,phone:r.phone,fit:r.fit,tier:"3",log:[],watched:false,
            note:r.division?"":"Division not set \u2014 needed to check when this coach may reply."});
          n++;
        });
        CS.preview=null; CS.msg="Added "+n+" coach"+(n===1?"":"es")+" from the list.";
        render();
      };
    }

    // ---- type one in
    if(CS.mode==="manual"){
      el("c-add").onclick=function(){ var s=el("c-school").value.trim(); if(!s)return;
        putTarget({id:uid(),athleteId:a.id,school:s,division:el("c-div").value,location:el("c-loc").value.trim(),
          coachName:el("c-name").value.trim(),coachEmail:el("c-email").value.trim(),fit:el("c-fit").value.trim(),
          tier:"3",log:[],watched:false,note:""}); render(); };
    }

    Array.prototype.forEach.call(host.querySelectorAll("[data-w]"),function(b){ b.onclick=function(){ S.tid=b.getAttribute("data-w"); switchView("write"); }; });
    Array.prototype.forEach.call(host.querySelectorAll("[data-x]"),function(b){ b.onclick=function(){ dropTarget(b.getAttribute("data-x")); render(); }; });
  }

  function showCoaches(a, school){
    CS.busy=true; CS.school=school; CS.msg="Reading "+(school.name||"the site")+"\u2019s coaching staff\u2026"; render();
    fetch("/api/schools/coaches?site="+encodeURIComponent(school.athletics_url)+"&sport="+encodeURIComponent(a.sport||"softball"))
      .then(function(r){ return r.json(); })
      .then(function(d){
        CS.busy=false;
        if(!d.ok){ CS.msg=(d.error&&d.error.message||"Couldn\u2019t read that site.")+(d.error&&d.error.hint?" "+d.error.hint:""); CS.coaches=null; render(); return; }
        CS.coaches=d.coaches; CS.sourceUrl=d.source_url; CS.sources=d.sources; CS.note=d.note; CS.msg="";
        CS.ticks=d.coaches.map(function(c){ return !!c.is_coach && !!c.email; });
        render();
      })
      .catch(function(){ CS.busy=false; CS.msg="Reading a school\u2019s site only works in the installed app."; render(); });
  }

  /* --- Write --- */
  var KINDS=[
    {k:"intro",   t:"First email",  d:"An introduction to a coach who has never heard of them."},
    {k:"coming",  t:"Coming up",    d:"Where to find them at the next tournament: field, time, jersey."},
    {k:"follow",  t:"Follow up",    d:"A nudge for a coach who hasn't answered, with what's changed since."},
    {k:"thanks",  t:"Thank you",    d:"For a coach who actually came and watched them play."}
  ];

  function renderWrite(){
    var a=A(), host=el("view-write");
    if(!a){ host.innerHTML='<div class="empty">Add an athlete first.</div>'; return; }
    var list=targetsFor(a.id);
    if(!list.length){ host.innerHTML=picker()+'<div class="empty">Add a coach first.</div>'; wirePicker(); return; }
    if(!S.tid||!S.targets[S.tid]||S.targets[S.tid].athleteId!==a.id) S.tid=list[0].id;
    var t=S.targets[S.tid], g=gate(t);
    var hist=t.log||[];
    var hasSent=hist.some(function(h){return h.action==="sent";});
    var hasEvents=(a.events||[]).length>0;

    function why(kind){
      if(kind==="coming"&&!hasEvents) return "Needs a tournament on the calendar.";
      if(kind==="follow"&&!hasSent) return "Nothing sent to this coach yet.";
      if(kind==="thanks"&&!t.watched) return "Mark that this coach came to watch, below.";
      return "";
    }

    host.innerHTML = picker()+
      '<div class="row"><div class="grow"><label>Coach</label><select id="tpick">'+
        list.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===t.id?' selected':'')+'>'+esc(x.school)+' — '+esc(x.coachName||"no coach")+'</option>';}).join("")+
      '</select></div></div>'+
      (!g.open? '<div class="banner stop"><b>'+(g.unknown?'Class year is missing.':'Held.')+'</b> '+
        (g.unknown?'Add it on the Player tab and this will resolve.':
          esc(g.rule.label)+' coaches may not reply to the class of '+esc(a.gradYear)+' until <b>'+esc(fmt(g.date))+'</b>. '+
          'The player may write today; the coach cannot answer until then, and the email should say so rather than pretend otherwise.')+'</div>' : "")+
      '<div class="card"><h3>What kind of email</h3>'+
        '<div class="kinds">'+KINDS.map(function(K){
          var block=why(K.k);
          return '<button class="kind" data-k="'+K.k+'" aria-pressed="'+(S.kind===K.k)+'"'+(block?' disabled title="'+esc(block)+'"':'')+'>'+
            '<b>'+esc(K.t)+'</b><span>'+esc(block||K.d)+'</span></button>';
        }).join("")+'</div>'+
        '<label style="margin-top:12px"><input type="checkbox" id="watched" '+(t.watched?'checked':'')+' style="width:auto;margin-right:8px">This coach came and watched them play</label>'+
        '<div class="row" style="margin-top:12px"><button class="btn" id="gen">Write it</button>'+
        '<span class="muted" id="state"></span></div>'+
      '</div>'+
      '<div class="card"><h3>The email</h3>'+
        '<label>Subject</label><input id="d-subj" value="'+esc(S.draft.subject||"")+'">'+
        '<label>Message</label><textarea id="d-body" class="draftbox" placeholder="Nothing written yet.">'+esc(S.draft.body||"")+'</textarea>'+
        '<div class="row" style="margin-top:10px">'+
          '<button class="btn" id="open">Open in email</button>'+
          '<button class="btn ghost" id="copy">Copy</button>'+
          '<button class="btn ghost" id="sent">Mark as sent</button>'+
        '</div>'+
        '<div class="muted" style="margin-top:8px">It opens in whatever email app the player is signed into, addressed and filled in. They read it, fix anything that does not sound like them, and press send.</div>'+
      '</div>'+
      (S.draft.facts&&S.draft.facts.length? '<div class="card"><h3>Check these before sending</h3><ul class="facts">'+
        S.draft.facts.map(function(f){return '<li>'+esc(f)+'</li>';}).join("")+'</ul></div>':"");

    wirePicker();
    el("tpick").onchange=function(){ S.tid=el("tpick").value; S.draft={subject:"",body:"",facts:[]}; render(); };
    Array.prototype.forEach.call(host.querySelectorAll("[data-k]"),function(b){ b.onclick=function(){ S.kind=b.getAttribute("data-k"); render(); }; });
    el("watched").onchange=function(){ t.watched=el("watched").checked; putTarget(t); render(); };
    el("gen").onclick=function(){ writeEmail(a,t); };
    el("copy").onclick=function(){ if(navigator.clipboard) navigator.clipboard.writeText(el("d-body").value).then(function(){
      el("copy").textContent="Copied"; setTimeout(function(){el("copy").textContent="Copy";},1400); }); };
    el("open").onclick=function(){
      window.location.href="mailto:"+encodeURIComponent(t.coachEmail||"")+"?subject="+encodeURIComponent(el("d-subj").value)+"&body="+encodeURIComponent(el("d-body").value);
    };
    el("sent").onclick=function(){
      t.log=t.log||[]; t.log.push({kind:S.kind,action:"sent",date:todayISO(),subject:el("d-subj").value});
      putTarget(t); S.draft={subject:"",body:"",facts:[]}; switchView("sent");
    };
    el("d-subj").oninput=function(){ S.draft.subject=el("d-subj").value; };
    el("d-body").oninput=function(){ S.draft.body=el("d-body").value; };
  }

  function kindBrief(kind, a, t){
    var hist=(t.log||[]).filter(function(h){return h.action==="sent";});
    var lastSent=hist.length?hist[hist.length-1]:null;
    if(kind==="intro") return "PURPOSE: first contact. The coach has never heard of this athlete. Say who they are and their class year, why this program specifically, two or three stats that matter for their position, where to watch them play on video, when and where they can be seen next, and one clear ask.";
    if(kind==="coming") return "PURPOSE: the athlete is playing somewhere the coach could come and watch. Lead with the tournament, the field and the time, and the jersey number so they can be picked out of a roster. Keep the stats to one or two. The ask is that the coach comes, or says what they would want to see.";
    if(kind==="follow") return "PURPOSE: a follow-up. The athlete wrote on "+(lastSent?lastSent.date:"an earlier date")+" and has had no answer. Do not repeat the first email. Lead with what has actually changed since — a new number from the stat line, a new tournament. Short. One ask. Do not sound aggrieved or apologetic about the silence.";
    if(kind==="thanks") return "PURPOSE: the coach came and watched them play. Thank them specifically and briefly. Reference the event by name if it is on the calendar. Do not re-pitch the whole resume; one honest line about how it went is enough, including if it went badly. The ask is small or absent.";
    return "";
  }

  function writeEmail(a,t){
    var st=el("state");
    if(!S.sample){ st.textContent="Writing isn't available in this view."; return; }
    if(S.busy) return;
    S.busy=true; el("gen").disabled=true; st.textContent="Writing…";
    var g=gate(t);
    var links=(a.links||[]).filter(function(l){return l.include!==false;}).map(function(l){return l.label+": "+l.url;}).join("\n")||"none";
    var socials=(a.socials||[]).filter(function(s){return s.include;}).map(function(s){return s.platform+": "+s.handle;}).join("\n")||"none";
    var stats=(a.stats||[]).map(function(s){return "- "+s.label+": "+s.value+" (source: "+(s.source||"unspecified")+")";}).join("\n")||"- none provided";
    var events=(a.events||[]).map(function(e){return "- "+e.date+", "+e.name+(e.location?", "+e.location:"");}).join("\n")||"- none provided";

    var pron=(a.pronouns||""), sport=(a.sport||"softball");
    var prompt=[
      "Write one recruiting email from a high school "+sport+" player to a college coach. The athlete reads it, edits it, and sends it personally.",
      (pron? "The athlete"+String.fromCharCode(39)+"s pronouns are "+pron+". Use those and no others."
         : "No pronouns are recorded. Use the athlete"+String.fromCharCode(39)+"s name and avoid pronouns entirely rather than assuming any."),
      "", kindBrief(S.kind,a,t), "",
      "HARD RULES:",
      "1. Use only what is below. Invent nothing. No number that is not in THEIR STATS, and never rounded up or projected.",
      "2. If something is missing, leave that subject out rather than filling it with something plausible.",
      "3. The voice of the athlete, matched to the writing sample. A teenager wrote this.",
      "4. Under 180 words. No bullet lists. No flattery. Never open with 'I am reaching out' or 'I hope this finds you well'.",
      "5. End with a signature block: the athlete's name, class year, email and phone; then \"NCAA Eligibility Center ID:\" and the number, if one is given; then a reference line for the reference coach with their name, email and phone, if given. Nothing else in the signature.",
      g.open?"":"6. Coaches at this division may not reply to this graduating class until "+fmt(g.date)+". Acknowledge that in one short, unbothered sentence rather than writing as though it does not exist.",
      "",
      "THE ATHLETE","Name: "+(a.name||""),"Class of: "+(a.gradYear||""),"High school: "+(a.school||""),"Club: "+(a.club||""),
      "Positions: "+(a.positions||""),"Jersey: "+(a.jersey||""),
      "Height: "+(a.height||"")+"  Weight: "+(a.weight||""),"Hometown: "+(a.hometown||""),"GPA: "+(a.gpa||"")+"  Tests: "+(a.tests||""),
      "Wants to study: "+(a.major||""),"Email: "+(a.email||"")+"  Phone: "+(a.phone||""),
      "NCAA Eligibility Center ID: "+(a.ncaaId||""),
      "Reference coach: "+[a.refName,a.refEmail,a.refPhone].filter(Boolean).join(", "),
      "","WHERE COACHES CAN WATCH THEM PLAY",links,
      "","SOCIAL ACCOUNTS THE ATHLETE CHOSE TO SHARE",socials,
      "","THEIR STATS (the only numbers allowed)",stats,
      "","THEIR SCHEDULE",events,
      "","THE PROGRAM","School: "+t.school,"Division: "+t.division,"Location: "+(t.location||""),
      "Coach: "+(t.coachName||""),"Why this school: "+(t.fit||"not given — write around it, do not invent a reason"),
      "Came to watch them play: "+(t.watched?"yes":"no"),
      "","EARLIER EMAILS TO THIS COACH",
      ((t.log||[]).map(function(h){return "- "+h.date+": "+h.kind+" — "+(h.subject||"");}).join("\n")||"none"),
      "","WRITING SAMPLE BY THE ATHLETE (match this)",(a.voice||"(none given — write plainly, short sentences, no adult polish)"),
      "",
      'Reply with only JSON: {"subject":"...","body":"...","facts":["every factual claim in the body, each naming where it came from"]}'
    ].join("\n");

    S.sample.json(prompt,{modelTier:"default"}).then(function(o){
      S.draft={subject:String(o.subject||""),body:String(o.body||""),facts:Array.isArray(o.facts)?o.facts.map(String):[]};
      t.log=t.log||[]; t.log.push({kind:S.kind,action:"drafted",date:todayISO(),subject:S.draft.subject});
      putTarget(t); S.busy=false; render();
    }).catch(function(e){
      S.busy=false; el("gen").disabled=false;
      st.textContent = e&&e.code==="not_granted" ? "Writing needs your permission — reload and allow it."
        : e&&e.code==="rate_limited" ? "Too many at once. Wait a minute."
        : e&&e.code==="invalid_json" ? "That came back garbled. Try again."
        : "Something went wrong.";
    });
  }

  /* --- Sent --- */
  function renderSent(){
    var a=A(), host=el("view-sent");
    if(!a){ host.innerHTML='<div class="empty">Add an athlete first.</div>'; return; }
    var list=targetsFor(a.id), rows=[], due=[];
    var today=todayISO();
    list.forEach(function(t){
      (t.log||[]).filter(function(h){return h.action==="sent";}).forEach(function(h){
        rows.push({school:t.school,coach:t.coachName,kind:h.kind,date:h.date,id:t.id});
      });
      var sent=(t.log||[]).filter(function(h){return h.action==="sent";});
      if(sent.length&&!t.replied){
        var lastD=sent[sent.length-1].date;
        var d=new Date(lastD); d.setDate(d.getDate()+14);
        if(d.toISOString().slice(0,10)<=today) due.push({school:t.school,id:t.id,since:lastD});
      }
    });
    rows.sort(function(x,y){ return y.date.localeCompare(x.date); });

    host.innerHTML = picker()+
      (due.length? '<div class="card"><h3>Waiting on an answer</h3>'+
        '<div class="lede">Two weeks or more with no reply. A short follow-up is normal, not a nuisance.</div>'+
        due.map(function(d){ return '<div class="stat-line"><b>'+esc(d.school)+'</b><span class="src">last written '+esc(d.since)+'</span>'+
          '<button class="btn quiet" data-fu="'+esc(d.id)+'">Follow up</button></div>'; }).join("")+'</div>' : "")+
      '<div class="card"><h3>Everything sent</h3>'+
        (rows.length? '<div class="scroll-x"><table><thead><tr><th>When</th><th>School</th><th>Coach</th><th>Kind</th></tr></thead><tbody>'+
          rows.map(function(r){ return '<tr><td>'+esc(r.date)+'</td><td>'+esc(r.school)+'</td><td>'+esc(r.coach||"")+'</td><td>'+esc(r.kind)+'</td></tr>'; }).join("")+
          '</tbody></table></div>' : '<div class="muted">Nothing yet.</div>')+
        (rows.length?'<button class="btn ghost" id="exp" style="margin-top:10px">Download a copy</button>':"")+
      '</div>';

    wirePicker();
    Array.prototype.forEach.call(host.querySelectorAll("[data-fu]"),function(b){
      b.onclick=function(){ S.tid=b.getAttribute("data-fu"); S.kind="follow"; S.draft={subject:"",body:"",facts:[]}; switchView("write"); };
    });
    if(el("exp")) el("exp").onclick=function(){
      var csv=["Date,School,Coach,Kind"].concat(rows.map(function(r){
        return [r.date,r.school,r.coach||"",r.kind].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(",");
      })).join("\n");
      if(S.downloads) S.downloads.save({filename:(a.name||"athlete").replace(/\s+/g,"-").toLowerCase()+"-emails.csv",data:csv}).catch(function(){});
      else if(navigator.clipboard){ navigator.clipboard.writeText(csv); el("exp").textContent="Copied instead"; }
    };
  }

  /* ---------- nav ---------- */
  function switchView(v){
    VIEW=v;
    Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"),function(b){ b.setAttribute("aria-selected",String(b.getAttribute("data-view")===v)); });
    Array.prototype.forEach.call(document.querySelectorAll("section.view"),function(s){
      var on = s.id==="view-"+v;
      s.classList.toggle("on", on);
      if(!on) s.innerHTML="";   // otherwise three copies of the paste card share element ids
    });
    render(); window.scrollTo(0,0);
  }
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"),function(b){ b.onclick=function(){ switchView(b.getAttribute("data-view")); }; });

  loadLocal();
  render();

  (async function(){
    try{
      var db=await claude.use("db");
      if(db){
        S.db=db;
        db.collection("athletes").onSnapshot(function(s){ var n={}; s.docs.forEach(function(d){ var v=clone(d.data()); v.id=v.id||d.id; n[v.id]=v; }); S.athletes=n; softRender(); },function(){});
        db.collection("targets").onSnapshot(function(s){ var n={}; s.docs.forEach(function(d){ var v=clone(d.data()); v.id=v.id||d.id; n[v.id]=v; }); S.targets=n; softRender(); },function(){});
        db.doc("config/rules").onSnapshot(function(s){ S.rules = s.exists? clone(s.data()) : defaultRules(); softRender(); },function(){});
      } else { if(!S.rules) S.rules=defaultRules(); render(); }
    }catch(e){}
  })();
  (async function(){ try{ S.sample=await claude.use("sample"); render(); }catch(e){} })();
  (async function(){ try{ S.downloads=await claude.use("downloads"); }catch(e){} })();
})();
</script>
</body>
</html>
